packages:
  - packages/*
  - www/*

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: ^0.3.0
  vitest: 5.1.0

onlyBuiltDependencies:
  - esbuild

overrides:
  vite: "catalog:"
  vitest: "catalog:"

peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
